name: verify-structured-data-preview

on:
  push:
    branches:
      - preview

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build once
        run: npm run build

      - name: Validate generated JSON-LD
        id: jsonld
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(target) : [target];
            });
          }

          const htmlFiles = walk('dist').filter((file) => file.endsWith('.html'));
          const pattern = /<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
          let count = 0;

          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(pattern)) {
              const json = match[1].trim();
              if (!json) throw new Error(`Empty JSON-LD block in ${file}`);
              JSON.parse(json);
              count += 1;
            }
          }

          if (count === 0) throw new Error('No JSON-LD blocks found in dist HTML');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${count}\n`);
          console.log(`Parsed ${count} JSON-LD blocks across ${htmlFiles.length} HTML files.`);
          NODE

      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JSONLD_COUNT: ${{ steps.jsonld.outputs.count }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"structured-data-verification\",\"description\":\"Build passed; ${JSONLD_COUNT} JSON-LD blocks parsed\"}"

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"structured-data-verification","description":"Build or JSON-LD validation failed"}'
