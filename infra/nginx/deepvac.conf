# deepvac.space: nginx-Konfiguration nach dem Website-Audit (Stand 01.10.2026, Version 2)
#
# Behebt: SEC-01 (Sicherheits-Header, Server-Version), SEO-01 (echte 404 statt Startseite),
#         SEO-02 (www und http leiten auf https://deepvac.space), P-05 (Caching, Kompression),
#         IA-04 (Alias-URLs per 301), /healthz als Text statt Binärdatei,
#         Seiten ohne Umleitung auf Adressen mit Schrägstrich (passend zu Canonical und Sitemap).
#
# Geschrieben für nginx 1.24 (Ubuntu) und die bestehende Ablage /var/www/deepvac/current.
#
# REIHENFOLGE
#   1. Zuerst die Lovable-Änderungen auf GitHub nach main mergen und den Deploy abwarten.
#      Erst dann liegen /404.html und /de/404.html im Release.
#   2. Sicherung der bisherigen Datei:
#        sudo cp /etc/nginx/sites-available/<deine-datei> ~/nginx-deepvac-$(date +%F).bak
#   3. Die bisherigen server-Blöcke für deepvac.space durch diese Datei ersetzen.
#      Die ssl_certificate-Pfade und certbot-Includes aus der bisherigen Datei übernehmen, falls sie abweichen.
#      Hat die bisherige Datei keine "listen [::]"-Zeilen, diese hier ebenfalls weglassen.
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Prüfen (erwartetes Ergebnis jeweils am Zeilenende):
#        curl -sI https://deepvac.space/gibt-es-nicht | head -1                 -> HTTP/2 404
#        curl -sI https://deepvac.space/de/gibt-es-nicht | head -1              -> HTTP/2 404
#        curl -sI https://www.deepvac.space/contact | grep -i '^location'       -> https://deepvac.space/contact
#        curl -sI http://deepvac.space/ | grep -i '^location'                  -> https://deepvac.space/
#        curl -sI https://deepvac.space/ | grep -iE '^(server|x-frame|x-content|referrer|permissions)'
#                                                                               -> Server: nginx (ohne Version) und vier Header
#        curl -sI https://deepvac.space/healthz | grep -i content-type           -> text/plain
#        curl -sI https://deepvac.space/tvac-questionnaire | head -1             -> HTTP/2 200
#        curl -sI https://deepvac.space/de/tvac-fragebogen | head -1             -> HTTP/2 200
#        curl -sI https://deepvac.space/products | head -1                       -> HTTP/2 200 (keine Umleitung)
#        curl -sI https://deepvac.space/products/ | grep -i '^location'          -> https://deepvac.space/products
#      Alle Sitemap-URLs müssen 200 liefern. Keine Ausgabe heißt: alles gut.
#        for u in $(curl -s https://deepvac.space/sitemap-{main,services,resources,legal}.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//'); do
#          c=$(curl -s -o /dev/null -w '%{http_code}' "$u"); [ "$c" = 200 ] || echo "$c $u"; done
#   6. Im Browser Startseite, Kontaktseite (Karte laden), Fragebogen (absenden) und den Talk-to-Sales-Dialog öffnen
#      und in der Entwicklerkonsole nach "Content-Security-Policy" suchen. Meldungen an Claude weitergeben.
#   7. Nach einer Woche ohne CSP-Meldungen:
#        "Content-Security-Policy-Report-Only" in "Content-Security-Policy" umbenennen,
#        die Strict-Transport-Security-Zeile einkommentieren, nginx -t, reload.
#
# RÜCKWEG
#   Sicherung zurückkopieren, dann sudo nginx -t && sudo systemctl reload nginx.


# Cache-Dauer je Dateityp. Die map steht außerhalb der server-Blöcke (http-Kontext).
map $uri $deepvac_cache_control {
    ~^/assets/                                                   "public, max-age=31536000, immutable";
    ~*\.(?:avif|webp|jpe?g|png|gif|svg|ico|mp4|webm|pdf|woff2?)$ "public, max-age=604800";
    default                                                      "no-cache";
}

# http -> https, für beide Hostnamen
server {
    listen 80;
    listen [::]:80;
    server_name deepvac.space www.deepvac.space;
    server_tokens off;
    return 301 https://deepvac.space$request_uri;
}

# www -> Apex-Domain (SEO-02)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.deepvac.space;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/deepvac.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepvac.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://deepvac.space$request_uri;
}

# Website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deepvac.space;

    ssl_certificate     /etc/letsencrypt/live/deepvac.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepvac.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/deepvac/current;
    index index.html;

    # SEC-01: keine nginx-Version im Server-Header
    server_tokens off;

    # SEC-01: Sicherheits-Header.
    # Wichtig: In den location-Blöcken unten bewusst kein add_header, sonst gelten diese Zeilen dort nicht mehr.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://assets.calendly.com https://plausible.io; style-src 'self' 'unsafe-inline' https://assets.calendly.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://gaqplqihsageeoqgiaqd.supabase.co https://plausible.io https://challenges.cloudflare.com; frame-src https://calendly.com https://www.google.com https://challenges.cloudflare.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Erst in Schritt 7 aktivieren:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # P-05: Caching über die map oben (gehashte Assets 1 Jahr, Medien 7 Tage, HTML immer prüfen)
    add_header Cache-Control $deepvac_cache_control always;

    # P-05: Kompression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Healthcheck für den Smoke-Test im Deploy, als Text statt Binärdatei
    location = /healthz {
        default_type text/plain;
        access_log off;
        try_files /healthz =404;
    }

    # IA-04: Alias-URLs dauerhaft auf die Hauptroute
    location ~ ^/catalogues/?$                      { return 301 /catalogs; }
    location ~ ^/services/retrofit-modernisation/?$ { return 301 /services/retrofit-modernization; }

    # URLs ohne Schrägstrich am Ende, so wie Canonical, Sitemap und hreflang sie nennen:
    # /products/ leitet dauerhaft auf /products um. Die Startseite / ist ausgenommen.
    rewrite ^/(.+)/$ /$1 permanent;

    # SEO-01: echte 404 mit vorgerenderter Fehlerseite statt Startseite.
    # Jede Route liegt als Verzeichnis mit index.html vor. "$uri/index.html" liefert sie direkt
    # mit 200 aus, ohne Umleitung auf eine Adresse mit Schrägstrich. Kein SPA-Fallback mehr nötig.
    error_page 404 /404.html;
    location = /404.html    { internal; }
    location = /de/404.html { internal; }

    location /de/ {
        error_page 404 /de/404.html;
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
